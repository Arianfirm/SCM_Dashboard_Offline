<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCM Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family:Inter,sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:24px;
}

h1{
    margin-bottom:8px;
}

.subtitle{
    color:#94a3b8;
    margin-bottom:24px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:#1e293b;
    border-radius:18px;
    padding:20px;
}

.card-title{
    color:#94a3b8;
    margin-bottom:10px;
}

.card-value{
    font-size:32px;
    font-weight:700;
}

.section{
    background:#1e293b;
    border-radius:18px;
    padding:20px;
    margin-bottom:24px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    text-align:left;
}

th{
    color:#94a3b8;
    border-bottom:1px solid #334155;
}

tr{
    border-bottom:1px solid #334155;
}

.good{
    color:#22c55e;
    font-weight:700;
}

.warning{
    color:#facc15;
    font-weight:700;
}

.bad{
    color:#ef4444;
    font-weight:700;
}
</style>
</head>

<body>

<h1>SCM Dashboard Offline</h1>
<div class="subtitle">Realtime KPI Dashboard</div>

<div class="grid">

    <div class="card">
        <div class="card-title">Total Gap Qty</div>
        <div class="card-value" id="gapqty">0</div>
    </div>

    <div class="card">
        <div class="card-title">Average Case Fill</div>
        <div class="card-value" id="casefill">0%</div>
    </div>

    <div class="card">
        <div class="card-title">Total Product</div>
        <div class="card-value" id="productcount">0</div>
    </div>

</div>

<div class="section">
    <h2>Top Gap Product</h2>
    <canvas id="chart"></canvas>
</div>

<div class="section">
    <h2>Top 10 Products</h2>

    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Gap Qty</th>
                <th>Case Fill</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>

// GANTI LINK INI
const csvUrl = "PASTE_YOUR_GOOGLE_SHEET_CSV_LINK";

// cari nama kolom otomatis
function findColumn(row, possibleNames){

    const keys = Object.keys(row);

    for(const key of keys){

        for(const name of possibleNames){

            if(
                key.toLowerCase().trim() ===
                name.toLowerCase().trim()
            ){
                return key;
            }
        }
    }

    return null;
}

async function loadDashboard(){

    try{

        const response = await fetch(csvUrl);

        const csvText = await response.text();

        const parsed = Papa.parse(csvText,{
            header:true,
            skipEmptyLines:true
        });

        const data = parsed.data;

        console.log("DATA:", data);

        if(data.length === 0){
            alert("Data kosong");
            return;
        }

        const sample = data[0];

        console.log("HEADERS:", Object.keys(sample));

        const productCol = findColumn(sample,
            ["Product","Product Name","SKU","Item"]);

        const gapCol = findColumn(sample,
            ["Gap_Qty","Gap Qty","Gap","Loss"]);

        const caseFillCol = findColumn(sample,
            ["Case_Fill","Case Fill","CF"]);

        if(!productCol || !gapCol || !caseFillCol){

            alert(
                "Kolom tidak ditemukan. Check console F12"
            );

            return;
        }

        // KPI
        let totalGap = 0;
        let totalCaseFill = 0;

        data.forEach(row=>{

            totalGap += Number(row[gapCol] || 0);

            totalCaseFill += Number(
                row[caseFillCol] || 0
            );
        });

        const avgCF =
            (totalCaseFill / data.length).toFixed(1);

        document.getElementById("gapqty")
            .innerText = totalGap.toLocaleString();

        document.getElementById("casefill")
            .innerText = avgCF + "%";

        document.getElementById("productcount")
            .innerText = data.length;

        // sorting
        data.sort((a,b)=>
            Number(b[gapCol] || 0) -
            Number(a[gapCol] || 0)
        );

        // table
        const tbody =
            document.getElementById("tableBody");

        data.slice(0,10).forEach(row=>{

            const cf =
                Number(row[caseFillCol] || 0);

            let statusClass = "good";
            let statusText = "GOOD";

            if(cf < 95){
                statusClass = "bad";
                statusText = "CRITICAL";
            }
            else if(cf < 98){
                statusClass = "warning";
                statusText = "WARNING";
            }

            tbody.innerHTML += `
                <tr>
                    <td>${row[productCol]}</td>
                    <td>${row[gapCol]}</td>
                    <td>${cf}%</td>
                    <td class="${statusClass}">
                        ${statusText}
                    </td>
                </tr>
            `;
        });

        // chart
        const labels =
            data.slice(0,7).map(x=>x[productCol]);

        const values =
            data.slice(0,7).map(x=>
                Number(x[gapCol] || 0)
            );

        new Chart(
            document.getElementById("chart"),
            {
                type:"bar",
                data:{
                    labels:labels,
                    datasets:[{
                        label:"Gap Qty",
                        data:values
                    }]
                },
                options:{
                    responsive:true,
                    plugins:{
                        legend:{
                            labels:{
                                color:"white"
                            }
                        }
                    },
                    scales:{
                        x:{
                            ticks:{
                                color:"white"
                            }
                        },
                        y:{
                            ticks:{
                                color:"white"
                            }
                        }
                    }
                }
            }
        );

    }catch(error){

        console.error(error);

        alert(
            "Error load dashboard. Check F12 console."
        );
    }
}

loadDashboard();

</script>

</body>
</html>
