<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCM Offline Dashboard — KPI Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-0:#06080d;--bg-1:#0c0f17;--bg-2:#12161f;--bg-3:#1a1f2b;--bg-4:#232938;--border:#1e2433;--border-h:#2a3146;--text-0:#f0f2f8;--text-1:#b8bdd0;--text-2:#6e7590;--text-3:#454d66;--good:#22d3a7;--good-g:linear-gradient(135deg,#22d3a7,#10b981);--warn:#f59e0b;--warn-g:linear-gradient(135deg,#fbbf24,#f59e0b);--bad:#ef4444;--bad-g:linear-gradient(135deg,#f87171,#ef4444);--mt:#3b82f6;--mt-g:linear-gradient(135deg,#60a5fa,#3b82f6);--gt:#a855f7;--gt-g:linear-gradient(135deg,#c084fc,#a855f7);--radius:14px;--shadow:0 1px 0 rgba(255,255,255,0.03) inset,0 20px 40px -20px rgba(0,0,0,0.5)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{background:var(--bg-0);color:var(--text-0);font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}.noise{position:fixed;top:0;left:0;width:100%;height:100%;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0}.glow-1{position:fixed;top:-200px;right:-200px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.06) 0%,transparent 70%);pointer-events:none;z-index:0}.glow-2{position:fixed;bottom:-200px;left:-100px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,0.05) 0%,transparent 70%);pointer-events:none;z-index:0}.wrap{max-width:1360px;margin:0 auto;padding:28px 32px 80px;position:relative;z-index:1}header{display:flex;align-items:center;justify-content:space-between;padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid var(--border)}.logo{display:flex;align-items:center;gap:14px}.logo-icon{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--bg-0);box-shadow:0 0 24px rgba(245,158,11,0.25)}.logo h1{font-size:20px;font-weight:700;letter-spacing:-0.03em}.logo .sub{font-size:12px;color:var(--text-2);font-weight:400;margin-top:1px}.meta{text-align:right}.meta .label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.1em;font-weight:600}.meta .val{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-1);margin-top:2px}.status{display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:8px}.dot{width:6px;height:6px;border-radius:50%}.dot.loading{background:#f59e0b;animation:pulse 1s infinite}.dot.ready{background:#22d3a7}.dot.error{background:#ef4444}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}.tabs{display:flex;gap:4px;background:var(--bg-2);border-radius:10px;padding:4px;margin-bottom:28px;border:1px solid var(--border);overflow-x:auto}.tab{padding:8px 18px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;transition:all 0.2s;white-space:nowrap;border:none;background:none;font-family:inherit}.tab:hover{color:var(--text-1);background:var(--bg-3)}.tab.active{color:var(--text-0);background:var(--bg-4);box-shadow:0 1px 4px rgba(0,0,0,0.3)}.panel{display:none}.panel.active{display:block;animation:fadeUp 0.3s ease}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;margin-top:28px}.sec-head:first-child{margin-top:0}.sec-head h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:var(--text-2);white-space:nowrap}.sec-head .line{flex:1;height:1px;background:var(--border)}.sec-head .badge{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-3);background:var(--bg-2);padding:3px 10px;border-radius:6px;border:1px solid var(--border)}.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hero{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius);padding:24px 26px 22px;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:border-color 0.2s}.hero:hover{border-color:var(--border-h)}.hero::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}.hero.mt::after{background:var(--mt-g)}.hero.gt::after{background:var(--gt-g)}.hero-label{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.06em;font-family:'JetBrains Mono',monospace}.hero.mt .hero-label{color:var(--mt);background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2)}.hero.gt .hero-label{color:var(--gt);background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.2)}.hero-label .dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}.cfr-big{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}.cfr-num{font-size:56px;font-weight:800;letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums}.cfr-pct{font-size:22px;font-weight:500;color:var(--text-2)}.cfr-tag{font-size:12px;color:var(--text-2);margin-bottom:18px}.bar{height:5px;background:var(--bg-4);border-radius:99px;overflow:hidden;margin-bottom:18px}.bar-fill{height:100%;border-radius:99px;transition:width 1s cubic-bezier(0.16,1,0.3,1)}.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:10px;overflow:hidden}.hs{background:var(--bg-1);padding:12px 14px}.hs .l{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:4px}.hs .v{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}.v-gap{color:var(--bad)}.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px}.mini{background:var(--bg-1);border:1px solid var(--border);border-radius:12px;padding:18px 20px;transition:border-color 0.15s,transform 0.15s}.mini:hover{border-color:var(--border-h);transform:translateY(-1px)}.mini-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}.mini-code{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-3);letter-spacing:0.06em;margin-bottom:3px}.mini-name{font-size:13px;font-weight:600;color:var(--text-0);line-height:1.3}.mini-dot{width:7px;height:7px;border-radius:50%;margin-top:4px;flex-shrink:0}.mini-dot.good{background:var(--good);box-shadow:0 0 8px var(--good)}.mini-dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}.mini-dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}.mini-cfr{display:flex;align-items:baseline;gap:4px;margin-bottom:10px}.mini-cfr-v{font-size:28px;font-weight:700;letter-spacing:-0.03em;line-height:1;font-variant-numeric:tabular-nums}.mini-cfr-v.good{color:var(--good)}.mini-cfr-v.warn{color:var(--warn)}.mini-cfr-v.bad{color:var(--bad)}.mini-cfr-u{font-size:13px;color:var(--text-2)}.mini-bar{height:3px;background:var(--bg-4);border-radius:99px;overflow:hidden;margin-bottom:14px}.mini-bar-fill{height:100%;border-radius:99px;transition:width 0.8s cubic-bezier(0.16,1,0.3,1)}.mini-row{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px}.mini-row .mr-l{color:var(--text-3);font-size:9px;text-transform:uppercase;letter-spacing:0.08em}.mini-row .mr-v{color:var(--text-1);font-weight:500;font-variant-numeric:tabular-nums}.tbl-wrap{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse}thead th{padding:12px 16px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-3);background:var(--bg-2);border-bottom:1px solid var(--border)}thead th:nth-child(n+3){text-align:right}tbody td{padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-1);font-variant-numeric:tabular-nums}tbody td:nth-child(n+3){text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px}tbody tr:hover{background:var(--bg-2)}tbody tr:last-child td{border-bottom:none}.td-product{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-0);font-weight:500}.td-gap{color:var(--bad);font-weight:600}@media(max-width:900px){.wrap{padding:16px}header{flex-direction:column;align-items:flex-start;gap:12px}.meta{text-align:left}.hero-row{grid-template-columns:1fr}.cfr-num{font-size:44px}}
</style>
</head>
<body>
<div class="noise"></div><div class="glow-1"></div><div class="glow-2"></div>
<div class="wrap">
<header>
  <div class="logo"><div class="logo-icon">S</div><div><h1>SCM Offline Dashboard</h1><div class="sub">Case Fill Rate · Modern Trade & General Trade</div></div></div>
  <div class="meta"><div class="status"><div class="dot loading" id="statusDot"></div><span id="statusText">Loading...</span></div><div class="val" id="lastUpdate">—</div></div>
</header>
<div class="tabs">
  <button class="tab active" data-tab="overview">Overview</button>
  <button class="tab" data-tab="channel">Channel Breakdown</button>
  <button class="tab" data-tab="region">Region</button>
  <button class="tab" data-tab="prodcat">Product Category</button>
  <button class="tab" data-tab="loss">Loss Products</button>
</div>
<div class="panel active" id="p-overview"></div>
<div class="panel" id="p-channel"></div>
<div class="panel" id="p-region"></div>
<div class="panel" id="p-prodcat"></div>
<div class="panel" id="p-loss"></div>
</div>
<script>
const F=new Intl.NumberFormat('id-ID');
const URLs={kpi_card:'https://docs.google.com/spreadsheets/d/e/2PACX-1vR0R5bDicm8BTQO2RxYfH35W8ABtobSTa1vxYmJL6TjjYrgMJeV7ArEgY6yQdgONlt-WnVKKhWFC01L/pub?gid=1299195614&single=true&output=csv',channel_breakdown:'https://docs.google.com/spreadsheets/d/e/2PACX-1vR0R5bDicm8BTQO2RxYfH35W8ABtobSTa1vxYmJL6TjjYrgMJeV7ArEgY6yQdgONlt-WnVKKhWFC01L/pub?gid=1855238933&single=true&output=csv',region_overall:'https://docs.google.com/spreadsheets/d/e/2PACX-1vR0R5bDicm8BTQO2RxYfH35W8ABtobSTa1vxYmJL6TjjYrgMJeV7ArEgY6yQdgONlt-WnVKKhWFC01L/pub?gid=1912905222&single=true&output=csv',region_channel:'https://docs.google.com/spreadsheets/d/e/2PACX-1vR0R5bDicm8BTQO2RxYfH35W8ABtobSTa1vxYmJL6TjjYrgMJeV7ArEgY6yQdgONlt-WnVKKhWFC01L/pub?gid=994520828&single=true&output=csv',category_channel:'https://docs.google.com/spreadsheets/d/e/2PACX-1vR0R5bDicm8BTQO2RxYfH35W8ABtobSTa1vxYmJL6TjjYrgMJeV7ArEgY6yQdgONlt-WnVKKhWFC01L/pub?gid=1570785348&single=true&output=csv',loss_product:'https://docs.google.com/spreadsheets/d/e/2PACX-1vR0R5bDicm8BTQO2RxYfH35W8ABtobSTa1vxYmJL6TjjYrgMJeV7ArEgY6yQdgONlt-WnVKKhWFC01L/pub?gid=1012894464&single=true&output=csv'};
function cls(c){return c>=95?'good':c>=85?'warn':'bad'}
function grad(c){return c>=95?'var(--good-g)':c>=85?'var(--warn-g)':'var(--bad-g)'}
function cfrC(c){return c>=95?'var(--good)':c>=85?'var(--warn)':'var(--bad)'}
function num(v){const n=parseFloat(String(v||'0').replace(/,/g,'.'));return isNaN(n)?0:n}
document.querySelectorAll('.tab').forEach(t=>{t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('p-'+t.dataset.tab).classList.add('active')})});
function heroHTML(name,cfr,qty,dlv,gap,type){return`<div class="hero ${type}"><div class="hero-label"><span class="dot"></span>${name}</div><div class="cfr-big"><span class="cfr-num" style="color:${cfrC(cfr)}">${cfr.toFixed(2)}</span><span class="cfr-pct">%</span></div><div class="cfr-tag">Case Fill Rate</div><div class="bar"><div class="bar-fill" style="width:${Math.min(cfr,100)}%;background:${grad(cfr)}"></div></div><div class="hero-stats"><div class="hs"><div class="l">Order Qty</div><div class="v">${F.format(qty)}</div></div><div class="hs"><div class="l">Delivered</div><div class="v">${F.format(dlv)}</div></div><div class="hs"><div class="l">Gap</div><div class="v ${gap>0?'v-gap':''}">${gap>0?'−':''}${F.format(Math.abs(gap))}</div></div></div></div>`}
function miniHTML(name,cfr,qty,dlv,gap){const c=cls(cfr);return`<div class="mini"><div class="mini-top"><div><div class="mini-name">${name}</div></div><div class="mini-dot ${c}"></div></div><div class="mini-cfr"><span class="mini-cfr-v ${c}">${cfr.toFixed(2)}</span><span class="mini-cfr-u">%</span></div><div class="mini-bar"><div class="mini-bar-fill" style="width:${Math.min(cfr,100)}%;background:${grad(cfr)}"></div></div><div class="mini-row"><div><span class="mr-l">Order</span><br><span class="mr-v">${F.format(qty)}</span></div><div><span class="mr-l">Delivered</span><br><span class="mr-v">${F.format(dlv)}</span></div><div><span class="mr-l">Gap</span><br><span class="mr-v" style="color:${gap>0?'var(--bad)':'var(--text-2)'}">${F.format(gap)}</span></div></div></div>`}
function parseCSV(text){const lines=text.split('\n');const headers=lines[0].split(',').map(s=>s.trim());const rows=[];for(let i=1;i<lines.length;i++){if(!lines[i].trim())continue;const vals=lines[i].split(',').map(s=>s.trim());const row={};headers.forEach((h,idx)=>{row[h]=vals[idx]||''});rows.push(row)}return rows}
async function loadData(){try{document.getElementById('statusDot').className='dot loading';document.getElementById('statusText').textContent='Loading...';const results=await Promise.all(Object.entries(URLs).map(async([key,url])=>{const res=await fetch(url);const text=await res.text();return{key,rows:parseCSV(text)}}));const data={};results.forEach(({key,rows})=>data[key]=rows);const kpiRow=data.kpi_card.find(r=>r['Week']?.includes('2026'));const mtCFR=num(kpiRow?.['Case Fill']||0);const mtQty=num(kpiRow?.['Order Qty']||0);const mtDlv=num(kpiRow?.['Delivered Qty']||0);const mtGap=num(kpiRow?.['Gap Qty']||0);const chByType={};data.channel_breakdown.forEach(r=>{const type=r['Channel']?.trim();const qty=num(r['Order Qty']);const dlv=num(r['Delivered Qty']);const gap=num(r['Gap Qty']);if(!type||!qty)return;if(!chByType[type])chByType[type]={qty:0,dlv:0,gap:0};chByType[type].qty+=qty;chByType[type].dlv+=dlv;chByType[type].gap+=gap});let h='<div class="sec-head"><h2>Overall Case Fill Rate</h2><div class="line"></div><div class="badge">'+F.format(mtQty)+' qty</div></div><div class="hero-row">';const gtData=chByType['GT']||{qty:0,dlv:0,gap:0};const gtCFR=gtData.qty?Math.round(gtData.dlv/gtData.qty*10000)/100:0;h+=heroHTML('MT',mtCFR,mtQty,mtDlv,mtGap,'mt');h+=heroHTML('GT',gtCFR,gtData.qty,gtData.dlv,gtData.gap,'gt');h+='</div>';document.getElementById('p-overview').innerHTML=h;h='<div class="sec-head"><h2>Channels</h2><div class="line"></div></div><div class="card-grid">';data.channel_breakdown.forEach(r=>{const ch=r['Order Lines/Analytic Level 2']?.trim();const qty=num(r['Order Qty']);const dlv=num(r['Delivered Qty']);const gap=num(r['Gap Qty']);if(!ch||!qty)return;const cfr=qty?Math.round(dlv/qty*10000)/100:0;h+=miniHTML(ch,cfr,qty,dlv,gap)});h+='</div>';document.getElementById('p-channel').innerHTML=h;h='<div class="sec-head"><h2>Region Overall</h2><div class="line"></div></div><div class="card-grid">';const regionMap={};data.region_overall.forEach(r=>{const reg=r['Region']?.trim();const qty=num(r['Order Qty']);const dlv=num(r['Delivered Qty']);if(!reg||!qty)return;regionMap[reg]={qty,dlv}});Object.entries(regionMap).sort((a,b)=>{const cfra=a[1].qty?a[1].dlv/a[1].qty:0;const cfrb=b[1].qty?b[1].dlv/b[1].qty:0;return cfra-cfrb}).forEach(([reg,d])=>{const cfr=d.qty?Math.round(d.dlv/d.qty*10000)/100:0;const gap=d.qty-d.dlv;h+=miniHTML(reg,cfr,d.qty,d.dlv,gap)});h+='</div>';h+='<div class="sec-head"><h2>Region × Channel</h2><div class="line"></div></div><div class="card-grid">';const regChMap={};data.region_channel.forEach(r=>{const key=r['Region']?.trim()+'|'+r['Channel']?.trim();const qty=num(r['Order Qty']);const dlv=num(r['Delivered Qty']);if(!key||!qty)return;regChMap[key]={qty,dlv}});Object.entries(regChMap).sort((a,b)=>{const cfra=a[1].qty?a[1].dlv/a[1].qty:0;const cfrb=b[1].qty?b[1].dlv/b[1].qty:0;return cfra-cfrb}).forEach(([key,d])=>{const cfr=d.qty?Math.round(d.dlv/d.qty*10000)/100:0;const gap=d.qty-d.dlv;h+=miniHTML(key,cfr,d.qty,d.dlv,gap)});h+='</div>';document.getElementById('p-region').innerHTML=h;h='<div class="sec-head"><h2>Product Category × Channel</h2><div class="line"></div></div><div class="card-grid">';const pcMap={};data.category_channel.forEach(r=>{const key=r['Category']?.trim()+'|'+r['Channel']?.trim();const qty=num(r['Order Qty']);const dlv=num(r['Delivered Qty']);if(!key||!qty)return;pcMap[key]={qty,dlv}});Object.entries(pcMap).sort((a,b)=>{const cfra=a[1].qty?a[1].dlv/a[1].qty:0;const cfrb=b[1].qty?b[1].dlv/b[1].qty:0;return cfra-cfrb}).forEach(([key,d])=>{const cfr=d.qty?Math.round(d.dlv/d.qty*10000)/100:0;const gap=d.qty-d.dlv;h+=miniHTML(key,cfr,d.qty,d.dlv,gap)});h+='</div>';document.getElementById('p-prodcat').innerHTML=h;h='<div class="sec-head"><h2>Loss Products (Gap > 0)</h2><div class="line"></div><div class="badge">'+data.loss_product.length+' products</div></div>';h+='<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Product</th><th>Order Qty</th><th>Delivered</th><th>Gap</th><th>CFR %</th></tr></thead><tbody>';data.loss_product.forEach((r,i)=>{const prod=r['Product']?.trim()||r['SKU']?.trim()||'—';const qty=num(r['Order Qty']);const dlv=num(r['Delivered Qty']);const gap=num(r['Gap Qty']);const cfr=qty?Math.round(dlv/qty*10000)/100:0;h+=`<tr><td>${i+1}</td><td class="td-product" title="${prod}">${prod}</td><td>${F.format(qty)}</td><td>${F.format(dlv)}</td><td class="td-gap">−${F.format(gap)}</td><td style="color:${cfrC(cfr)};font-weight:600">${cfr.toFixed(2)}%</td></tr>`});h+='</tbody></table></div>';document.getElementById('p-loss').innerHTML=h;document.getElementById('statusDot').className='dot ready';document.getElementById('statusText').textContent='Ready';document.getElementById('lastUpdate').textContent=new Date().toLocaleString('id-ID')}catch(err){console.error(err);document.getElementById('statusDot').className='dot error';document.getElementById('statusText').textContent='Error: '+err.message}}
loadData();
setInterval(loadData,5*60*1000);
</script>
</body>
</html>
