# Fixed SCM Dashboard (GitHub Pages Safe)

Copy FULL code below into `index.html`

<style>

<body>

<div class="container">

<div class="header">
  <div class="title">SCM Dashboard</div>
  <div class="status" id="status">Loading...</div>
</div>

<div class="grid" id="cards"></div>

<div class="table-wrap">
<table class="table">
<thead>
<tr>
<th>Product</th>
<th>Order Qty</th>
<th>Delivered Qty</th>
<th>Gap</th>
<th>CFR</th>
</tr>
</thead>
<tbody id="lossBody"></tbody>
</table>
</div>

</div>

<script>

const URLS = {

channel: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR0R5bDicm8BTQO2RxYfH35W8ABtobSTa1vxYmJL6TjjYrgMJeV7ArEgY6yQdgONlt-WnVKKhWFC01L/pub?gid=1855238933&single=true&output=csv',

loss: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR0R5bDicm8BTQO2RxYfH35W8ABtobSTa1vxYmJL6TjjYrgMJeV7ArEgY6yQdgONlt-WnVKKhWFC01L/pub?gid=1012894464&single=true&output=csv'

};

function parseCSV(text){

  const lines = text.trim().split('\n');

  const headers = lines[0]
    .split(',')
    .map(h => h.replace(/\r/g,'').trim());

  const rows = [];

  for(let i=1;i<lines.length;i++){

    const line = lines[i].trim();

    if(!line) continue;

    const values = line
      .split(',')
      .map(v => v.replace(/\r/g,'').trim());

    const row = {};

    headers.forEach((h,index)=>{
      row[h] = values[index] || '';
    });

    rows.push(row);
  }

  return rows;
}

function num(v){
  const n = parseFloat(String(v).replace(/,/g,''));
  return isNaN(n) ? 0 : n;
}

function getColor(v){

  if(v >= 95) return '#22c55e';
  if(v >= 85) return '#f59e0b';

  return '#ef4444';
}

function getClass(v){

  if(v >= 95) return 'good';
  if(v >= 85) return 'warn';

  return 'bad';
}

async function getCSV(url){

  const res = await fetch(url + '&t=' + Date.now());

  if(!res.ok){
    throw new Error('Failed fetch');
  }

  const text = await res.text();

  return parseCSV(text);
}

async function loadDashboard(){

  try{

    document.getElementById('status').innerText = 'Loading data...';

    const channelData = await getCSV(URLS.channel);
    const lossData = await getCSV(URLS.loss);

    const cards = document.getElementById('cards');

    let html = '';

    channelData.forEach(r => {

      const qty = num(r['Order Qty']);
      const delivered = num(r['Delivered Qty']);

      if(qty === 0) return;

      const cfr = (delivered / qty) * 100;
      const gap = qty - delivered;

      html += `
      <div class="card">

        <div class="label">${r['Order Lines/Analytic Level 2'] || 'Channel'}</div>

        <div class="big ${getClass(cfr)}">
          ${cfr.toFixed(2)}%
        </div>

        <div class="bar">
          <div class="fill" style="width:${Math.min(cfr,100)}%;background:${getColor(cfr)}"></div>
        </div>

        <div class="stats">
          <div>Order: ${qty}</div>
          <div>Delivered: ${delivered}</div>
          <div>Gap: ${gap}</div>
        </div>

      </div>
      `;
    });

    cards.innerHTML = html;

    let tableHTML = '';

    lossData.forEach(r => {

      const qty = num(r['Order Qty']);
      const delivered = num(r['Delivered Qty']);
      const gap = qty - delivered;

      const cfr = qty > 0
        ? (delivered / qty) * 100
        : 0;

      tableHTML += `
      <tr>
        <td>${r['Product'] || '-'}</td>
        <td>${qty}</td>
        <td>${delivered}</td>
        <td>${gap}</td>
        <td style="color:${getColor(cfr)}">
          ${cfr.toFixed(2)}%
        </td>
