<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCM Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family:Arial;
    background:#111827;
    color:white;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

.card-container{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.card{
    background:#1f2937;
    padding:20px;
    border-radius:12px;
    min-width:220px;
}

.value{
    font-size:32px;
    font-weight:bold;
    margin-top:10px;
}

.section{
    background:#1f2937;
    padding:20px;
    border-radius:12px;
    margin-top:25px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #374151;
}

canvas{
    background:white;
    border-radius:10px;
}
</style>
</head>

<body>

<h1>SCM Dashboard Offline</h1>

<div class="card-container">

    <div class="card">
        <div>Total Product</div>
        <div class="value" id="totalProduct">0</div>
    </div>

    <div class="card">
        <div>Total Gap Qty</div>
        <div class="value" id="totalGap">0</div>
    </div>

    <div class="card">
        <div>Average Case Fill</div>
        <div class="value" id="avgCF">0%</div>
    </div>

</div>

<div class="section">
    <h2>Top Gap Product</h2>
    <canvas id="myChart"></canvas>
</div>

<div class="section">

    <h2>Top 10 Table</h2>

    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Gap Qty</th>
                <th>Case Fill</th>
            </tr>
        </thead>

        <tbody id="tbody">
        </tbody>

    </table>

</div>

<script>

// GANTI LINK INI
const csvUrl =
"https://docs.google.com/spreadsheets/d/e/PASTE/pub?output=csv";

async function loadData(){

    try{

        console.log("LOAD START");

        const response = await fetch(csvUrl);

        const text = await response.text();

        console.log(text);

        const rows = text.split("\\n")
            .map(r => r.split(","));

        if(rows.length < 2){
            alert("CSV kosong");
            return;
        }

        const headers = rows[0];

        const productIndex =
            headers.findIndex(h =>
                h.toLowerCase().includes("product")
            );

        const gapIndex =
            headers.findIndex(h =>
                h.toLowerCase().includes("gap")
            );

        const cfIndex =
            headers.findIndex(h =>
                h.toLowerCase().includes("case")
            );

        const data = rows.slice(1);

        let totalGap = 0;
        let totalCF = 0;

        data.forEach(r=>{

            totalGap += Number(r[gapIndex] || 0);

            totalCF += Number(r[cfIndex] || 0);

        });

        document.getElementById("totalProduct")
            .innerText = data.length;

        document.getElementById("totalGap")
            .innerText = totalGap;

        document.getElementById("avgCF")
            .innerText =
            (totalCF/data.length).toFixed(1) + "%";

        data.sort((a,b)=>
            Number(b[gapIndex] || 0) -
            Number(a[gapIndex] || 0)
        );

        const tbody =
            document.getElementById("tbody");

        data.slice(0,10).forEach(r=>{

            tbody.innerHTML += `
                <tr>
                    <td>${r[productIndex]}</td>
                    <td>${r[gapIndex]}</td>
                    <td>${r[cfIndex]}%</td>
                </tr>
            `;
        });

        const labels =
            data.slice(0,5).map(r=>r[productIndex]);

        const values =
            data.slice(0,5).map(r=>
                Number(r[gapIndex] || 0)
            );

        new Chart(
            document.getElementById("myChart"),
            {
                type:"bar",
                data:{
                    labels:labels,
                    datasets:[{
                        label:"Gap Qty",
                        data:values
                    }]
                }
            }
        );

        console.log("SUCCESS");

    }catch(err){

        console.error(err);

        alert("ERROR. CHECK F12 CONSOLE");

    }

}

loadData();

</script>

</body>
</html>
