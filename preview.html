<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#0f172a;
    color:#fff;
    padding:24px;
}

.header{
    margin-bottom:24px;
}

.header h1{
    font-size:32px;
    font-weight:700;
}

.header p{
    color:#94a3b8;
    margin-top:8px;
}

.kpi-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:24px;
    backdrop-filter:blur(12px);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-4px);
}

.card h3{
    color:#94a3b8;
    font-size:14px;
    margin-bottom:10px;
}

.card .value{
    font-size:34px;
    font-weight:700;
}

.section{
    background:rgba(255,255,255,0.05);
    border-radius:20px;
    padding:24px;
    margin-bottom:24px;
}

.section h2{
    margin-bottom:20px;
}

canvas{
    width:100%!important;
    max-height:400px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:14px;
    text-align:left;
}

th{
    color:#94a3b8;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

tr{
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.badge{
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
}

.good{
    background:#14532d;
}

.warning{
    background:#854d0e;
}

.bad{
    background:#7f1d1d;
}

@media(max-width:768px){
    body{
        padding:16px;
    }

    .header h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>Executive KPI Dashboard</h1>
    <p>Realtime Monitoring from Google Sheets</p>
</div>

<div class="kpi-grid">
    <div class="card">
        <h3>Total Sales</h3>
        <div class="value" id="sales">0</div>
    </div>

    <div class="card">
        <h3>Case Fill</h3>
        <div class="value" id="casefill">0%</div>
    </div>

    <div class="card">
        <h3>Gap Qty</h3>
        <div class="value" id="gapqty">0</div>
    </div>

    <div class="card">
        <h3>Top Region</h3>
        <div class="value" id="region">-</div>
    </div>
</div>

<div class="section">
    <h2>Weekly Trend</h2>
    <canvas id="trendChart"></canvas>
</div>

<div class="section">
    <h2>Top Loss Product</h2>

    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Gap Qty</th>
                <th>Case Fill</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>
    </table>
</div>

<script>

// GANTI DENGAN LINK CSV GOOGLE SHEET KAMU
const csvUrl = "PASTE_CSV_LINK_HERE";

async function loadData(){

    const response = await fetch(csvUrl);
    const csvText = await response.text();

    const parsed = Papa.parse(csvText,{
        header:true,
        skipEmptyLines:true
    });

    const data = parsed.data;

    if(data.length === 0){
        return;
    }

    // KPI SUMMARY
    let totalSales = 0;
    let totalGap = 0;
    let totalCaseFill = 0;

    data.forEach(row=>{
        totalSales += Number(row.Sales || 0);
        totalGap += Number(row.Gap_Qty || 0);
        totalCaseFill += Number(row.Case_Fill || 0);
    });

    const avgCaseFill = (totalCaseFill / data.length).toFixed(1);

    document.getElementById("sales").innerText =
        totalSales.toLocaleString();

    document.getElementById("gapqty").innerText =
        totalGap.toLocaleString();

    document.getElementById("casefill").innerText =
        avgCaseFill + "%";

    document.getElementById("region").innerText =
        data[0].Region || "-";

    // TABLE
    const tableBody = document.getElementById("tableBody");

    data.sort((a,b)=>
        Number(b.Gap_Qty || 0) -
        Number(a.Gap_Qty || 0)
    );

    data.slice(0,10).forEach(row=>{

        const cf = Number(row.Case_Fill || 0);

        let status = "good";
        let text = "Good";

        if(cf < 95){
            status = "bad";
            text = "Critical";
        }else if(cf < 98){
            status = "warning";
            text = "Warning";
        }

        tableBody.innerHTML += `
        <tr>
            <td>${row.Product || "-"}</td>
            <td>${row.Gap_Qty || 0}</td>
            <td>${cf}%</td>
            <td>
                <span class="badge ${status}">
                    ${text}
                </span>
            </td>
        </tr>
        `;
    });

    // CHART
    const labels = data.slice(0,7).map(x=>x.Product);
    const values = data.slice(0,7).map(x=>Number(x.Gap_Qty || 0));

    new Chart(
        document.getElementById("trendChart"),
        {
            type:"bar",
            data:{
                labels:labels,
                datasets:[{
                    label:"Gap Qty",
                    data:values
                }]
            },
            options:{
                responsive:true,
                plugins:{
                    legend:{
                        labels:{
                            color:"#fff"
                        }
                    }
                },
                scales:{
                    x:{
                        ticks:{
                            color:"#fff"
                        }
                    },
                    y:{
                        ticks:{
                            color:"#fff"
                        }
                    }
                }
            }
        }
    );
}

loadData();

</script>

</body>
</html>
