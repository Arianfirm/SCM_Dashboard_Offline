<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SCM Executive Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--bg:#0b0911;
--sidebar:#12101B;
--card:#171320;
--card2:#1F1A2B;

--text:#ffffff;
--muted:#8E94A7;

--purple:#7C3AED;
--purple2:#A855F7;

--green:#22C55E;
--red:#EF4444;

--border:rgba(255,255,255,.06);

}

body{

background:
linear-gradient(
180deg,
#0b0911,
#141020
);

font-family:'Plus Jakarta Sans',sans-serif;

color:var(--text);

display:flex;

}

/* SIDEBAR */

.sidebar{

width:250px;

height:100vh;

position:fixed;

left:0;
top:0;

background:var(--sidebar);

border-right:1px solid var(--border);

padding:28px 18px;

}

.logo{

margin-bottom:40px;

}

.logo h1{

font-size:28px;

font-weight:800;

}

.logo p{

margin-top:6px;

font-size:12px;

color:var(--muted);

}

.nav{

display:flex;

flex-direction:column;

gap:12px;

}

.nav button{

border:none;

background:transparent;

padding:16px 18px;

border-radius:18px;

color:var(--muted);

font-size:14px;

font-weight:600;

cursor:pointer;

transition:.25s;

text-align:left;

}

.nav button:hover{

background:#1E1A2A;

color:white;

}

.nav button.active{

background:
linear-gradient(
135deg,
var(--purple),
var(--purple2)
);

color:white;

}

/* MAIN */

.main{

margin-left:250px;

width:100%;

padding:30px;

}

/* TOPBAR */

.topbar{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:28px;

}

.title h2{

font-size:34px;

font-weight:800;

}

.title p{

margin-top:6px;

font-size:13px;

color:var(--muted);

}

select{

background:#1F1A2B;

border:none;

padding:14px 18px;

border-radius:14px;

color:white;

outline:none;

font-weight:600;

}

/* PAGE */

.page{
display:none;
}

.page.active{
display:block;
}

/* KPI */

.kpi-grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:24px;

margin-bottom:24px;

}

.kpi{

background:var(--card);

border:1px solid var(--border);

border-radius:30px;

padding:28px;

}

.kpi-top{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}

.kpi-title{

font-size:20px;

font-weight:700;

}

.badge{

padding:8px 14px;

border-radius:999px;

font-size:12px;

font-weight:700;

color:white;

}

.mt{
background:var(--purple);
}

.gt{
background:var(--red);
}

.kpi-big{

font-size:72px;

font-weight:800;

line-height:1;

margin-bottom:24px;

}

.kpi-detail{

display:grid;

grid-template-columns:1fr 1fr;

gap:14px;

}

.detail{

background:var(--card2);

padding:16px;

border-radius:18px;

}

.detail small{

font-size:11px;

color:var(--muted);

}

.detail strong{

display:block;

margin-top:8px;

font-size:22px;

}

/* GRID */

.grid{

display:grid;

grid-template-columns:2fr 1fr;

gap:24px;

margin-bottom:24px;

}

/* CARD */

.card{

background:var(--card);

border:1px solid var(--border);

border-radius:30px;

padding:28px;

}

.card-title{

font-size:18px;

font-weight:700;

margin-bottom:22px;

}

/* TABLE */

table{

width:100%;

border-collapse:collapse;

}

th{

padding:14px;

text-align:left;

font-size:12px;

color:var(--muted);

border-bottom:1px solid var(--border);

}

td{

padding:18px 14px;

font-size:13px;

border-bottom:1px solid rgba(255,255,255,.05);

}

/* SKU */

.sku-grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:22px;

}

.sku-card{

background:var(--card);

border:1px solid var(--border);

border-radius:26px;

padding:24px;

}

.sku-name{

font-size:15px;

font-weight:700;

line-height:1.5;

margin-bottom:18px;

}

.sku-detail{

display:grid;

grid-template-columns:1fr 1fr;

gap:14px;

}

.sku-box{

background:var(--card2);

padding:14px;

border-radius:16px;

}

.sku-box small{

font-size:11px;

color:var(--muted);

}

.sku-box strong{

display:block;

margin-top:8px;

font-size:18px;

}

.loss{
color:var(--red);
}

.success{
color:var(--green);
}

.cf{
color:#A855F7;
}

/* MOBILE */

@media(max-width:1200px){

.grid{
grid-template-columns:1fr;
}

.sku-grid{
grid-template-columns:1fr;
}

}

@media(max-width:900px){

.sidebar{
position:relative;
width:100%;
height:auto;
}

.main{
margin-left:0;
}

.kpi-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">

<h1>SCM Dashboard</h1>

<p>Executive Monitoring</p>

</div>

<div class="nav">

<button class="active"
onclick="showPage('overview',this)">
Overview
</button>

<button onclick="showPage('loss',this)">
Trend SKU Loss
</button>

<button onclick="showPage('best',this)">
Trend SKU Laku
</button>

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- TOPBAR -->

<div class="topbar">

<div class="title">

<h2>Supply Chain Dashboard</h2>

<p>Realtime KPI Monitoring</p>

</div>

<select id="weekFilter"></select>

</div>

<!-- OVERVIEW -->

<div class="page active"
id="overviewPage">

<!-- KPI -->

<div class="kpi-grid">

<!-- MT -->

<div class="kpi">

<div class="kpi-top">

<div class="kpi-title">
Modern Trade
</div>

<div class="badge mt">
MT
</div>

</div>

<div class="kpi-big"
id="mtCF">
0%
</div>

<div class="kpi-detail">

<div class="detail">
<small>ORDER</small>
<strong id="mtOrder">0</strong>
</div>

<div class="detail">
<small>DELIVERY</small>
<strong id="mtDelivery">0</strong>
</div>

<div class="detail">
<small>GAP</small>
<strong id="mtGap">0</strong>
</div>

<div class="detail">
<small>CASE FILL</small>
<strong id="mtCF2">0%</strong>
</div>

</div>

</div>

<!-- GT -->

<div class="kpi">

<div class="kpi-top">

<div class="kpi-title">
General Trade
</div>

<div class="badge gt">
GT
</div>

</div>

<div class="kpi-big"
id="gtCF">
0%
</div>

<div class="kpi-detail">

<div class="detail">
<small>ORDER</small>
<strong id="gtOrder">0</strong>
</div>

<div class="detail">
<small>DELIVERY</small>
<strong id="gtDelivery">0</strong>
</div>

<div class="detail">
<small>GAP</small>
<strong id="gtGap">0</strong>
</div>

<div class="detail">
<small>CASE FILL</small>
<strong id="gtCF2">0%</strong>
</div>

</div>

</div>

</div>

<!-- CHART -->

<div class="grid">

<div class="card">

<div class="card-title">
Channel Breakdown
</div>

<canvas id="barChart"></canvas>

</div>

<div class="card">

<div class="card-title">
Overall Case Fill
</div>

<canvas id="donutChart"></canvas>

</div>

</div>

<!-- TABLE -->

<div class="card">

<div class="card-title">
KPI Breakdown
</div>

<table>

<thead>

<tr>

<th>Breakdown</th>
<th>Order</th>
<th>Delivery</th>
<th>Gap</th>
<th>CF%</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

<!-- LOSS -->

<div class="page"
id="lossPage">

<div class="sku-grid"
id="lossContainer">
</div>

</div>

<!-- BEST -->

<div class="page"
id="bestPage">

<div class="sku-grid"
id="bestContainer">
</div>

</div>

</div>

<script>

/* CSV API */

const KPI_CHANNEL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSzawLo-UIWO6rctA1PJGsrpEQyoFzkONyyhYOPknMXJHVlV24tVXX0LhNM6N8q1nmN-InEme4C3iGE/pub?gid=349702860&single=true&output=csv";

const KPI_BREAKDOWN =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSzawLo-UIWO6rctA1PJGsrpEQyoFzkONyyhYOPknMXJHVlV24tVXX0LhNM6N8q1nmN-InEme4C3iGE/pub?gid=1343041753&single=true&output=csv";

const TOP_LOSS_PRODUCT =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSzawLo-UIWO6rctA1PJGsrpEQyoFzkONyyhYOPknMXJHVlV24tVXX0LhNM6N8q1nmN-InEme4C3iGE/pub?gid=1801155860&single=true&output=csv";

/* GLOBAL */

let channelData = [];
let breakdownData = [];
let lossData = [];

let barChart;
let donutChart;

/* CSV PARSER */

function parseCSV(text){

const rows = text.trim().split("\\n");

const headers = rows[0].split(",");

return rows.slice(1).map(row=>{

const cols = row.split(",");

const obj = {};

headers.forEach((h,i)=>{

obj[h.trim()] =
cols[i]
? cols[i].replace(/"/g,'').trim()
: "";

});

return obj;

});

}

function fmt(n){

return Number(n)
.toLocaleString("id-ID");

}

/* NAVIGATION */

function showPage(page,btn){

document
.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document
.querySelectorAll(".nav button")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

document.getElementById(page+"Page")
.classList.add("active");

}

/* LOAD */

async function loadData(){

const [c1,c2,c3] = await Promise.all([

fetch(KPI_CHANNEL).then(r=>r.text()),
fetch(KPI_BREAKDOWN).then(r=>r.text()),
fetch(TOP_LOSS_PRODUCT).then(r=>r.text())

]);

channelData = parseCSV(c1);
breakdownData = parseCSV(c2);
lossData = parseCSV(c3);

setupWeek();

}

/* WEEK */

function setupWeek(){

const weeks = [...new Set(
breakdownData.map(d=>d.Week)
)];

const select =
document.getElementById("weekFilter");

select.innerHTML =
weeks.map(w=>`<option>${w}</option>`).join('');

render(weeks[0]);

select.addEventListener(
"change",
()=>render(select.value)
);

}

/* RENDER */

function render(week){

const channels =
channelData.filter(d=>d.Week===week);

const breakdown =
breakdownData.filter(d=>d.Week===week);

const losses =
lossData.filter(d=>d.Week===week);

const mt =
channels.find(d=>d.Channel.includes("MT"));

const gt =
channels.find(d=>d.Channel.includes("GT"));

if(mt){

mtOrder.innerHTML =
fmt(mt["Order Quantity"]);

mtDelivery.innerHTML =
fmt(mt["Delivery Quantity"]);

mtGap.innerHTML =
fmt(mt["GAP"]);

mtCF.innerHTML =
Number(mt["Case Fill"]).toFixed(2)+"%";

mtCF2.innerHTML =
Number(mt["Case Fill"]).toFixed(2)+"%";

}

if(gt){

gtOrder.innerHTML =
fmt(gt["Order Quantity"]);

gtDelivery.innerHTML =
fmt(gt["Delivery Quantity"]);

gtGap.innerHTML =
fmt(gt["GAP"]);

gtCF.innerHTML =
Number(gt["Case Fill"]).toFixed(2)+"%";

gtCF2.innerHTML =
Number(gt["Case Fill"]).toFixed(2)+"%";

}

/* TABLE */

tableBody.innerHTML =
breakdown.map(d=>`

<tr>

<td>${d["Channel Breakdown"]}</td>

<td>${fmt(d["Order Quantity"])}</td>

<td>${fmt(d["Delivery Quantity"])}</td>

<td>${fmt(d["GAP"])}</td>

<td>
${Number(d["Case Fill"]).toFixed(2)}%
</td>

</tr>

`).join('');

/* LOSS */

lossContainer.innerHTML =
losses

.filter(d =>
Number(d["GAP"]) < 0
)

.sort((a,b)=>
Number(a["GAP"])
-
Number(b["GAP"])
)

.slice(0,12)

.map(d=>`

<div class="sku-card">

<div class="sku-name">

${d["Product Name"]}

</div>

<div class="sku-detail">

<div class="sku-box">
<small>ORDER</small>
<strong>
${fmt(d["Order Quantity"])}
</strong>
</div>

<div class="sku-box">
<small>DELIVERY</small>
<strong>
${fmt(d["Delivery Quantity"])}
</strong>
</div>

<div class="sku-box">
<small>GAP</small>
<strong class="loss">
${fmt(d["GAP"])}
</strong>
</div>

<div class="sku-box">
<small>CASE FILL</small>
<strong class="cf">
${Number(d["Case Fill"]).toFixed(1)}%
</strong>
</div>

</div>

</div>

`).join('');

/* BEST */

bestContainer.innerHTML =
losses

.sort((a,b)=>
Number(b["Delivery Quantity"])
-
Number(a["Delivery Quantity"])
)

.slice(0,12)

.map(d=>`

<div class="sku-card">

<div class="sku-name">

${d["Product Name"]}

</div>

<div class="sku-detail">

<div class="sku-box">
<small>ORDER</small>
<strong>
${fmt(d["Order Quantity"])}
</strong>
</div>

<div class="sku-box">
<small>DELIVERY</small>
<strong class="success">
${fmt(d["Delivery Quantity"])}
</strong>
</div>

<div class="sku-box">
<small>GAP</small>
<strong>
${fmt(d["GAP"])}
</strong>
</div>

<div class="sku-box">
<small>CASE FILL</small>
<strong class="cf">
${Number(d["Case Fill"]).toFixed(1)}%
</strong>
</div>

</div>

</div>

`).join('');

buildCharts(breakdown);

}

/* CHART */

function buildCharts(data){

if(barChart)
barChart.destroy();

if(donutChart)
donutChart.destroy();

barChart =
new Chart(

document.getElementById("barChart"),

{

type:"bar",

data:{

labels:
data.map(d=>d["Channel Breakdown"]),

datasets:[{

data:
data.map(d=>Number(d["Case Fill"])),

borderRadius:14

}]

},

options:{

plugins:{
legend:{
display:false
}
},

scales:{

y:{

min:0,
max:110,

ticks:{
callback:v=>v+"%"
}

}

}

}

}

);

const avg =
data.reduce((a,b)=>
a+Number(b["Case Fill"]),0)
/ data.length;

donutChart =
new Chart(

document.getElementById("donutChart"),

{

type:"doughnut",

data:{

labels:["Delivered","Gap"],

datasets:[{

data:[
avg,
100-avg
]

}]

},

options:{

cutout:"76%",

plugins:{
legend:{
display:false
}
}

}

}

);

}

loadData();

</script>

</body>
</html>
