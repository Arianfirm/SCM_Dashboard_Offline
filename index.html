<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>SCM Dashboard Offline</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{

  --bg:#F4F4F8;
  --sidebar:#1C1C2E;
  --sidebar-hover:#2A2A3E;
  --sidebar-active:#32324A;

  --white:#FFFFFF;
  --text:#1A1A2E;
  --muted:#6B7280;
  --border:#E5E7EB;

  --purple:#7C79E0;
  --blue:#3B82F6;
  --pink:#E879A0;
  --green:#22C55E;
  --red:#EF4444;

}

body{

  background:var(--bg);

  font-family:'Inter',sans-serif;

  color:var(--text);

}

/* ======================
   BAR LABEL FIX
====================== */

.chart-label{

  font-size:11px;

  font-weight:700;

  fill:#374151;

}

/* ======================
   REGION BAR
====================== */

.region-bar-wrap{

  position:relative;

  width:100%;

  margin-top:12px;

}

.region-bar{

  height:30px;

  border-radius:8px;

}

</style>
</head>

<body>

<script>

/* =========================
   SOURCES
========================= */

const URL_CHANNEL   = "YOUR_URL";
const URL_BREAKDOWN = "YOUR_URL";
const URL_SKU       = "YOUR_URL";
const URL_REGION    = "YOUR_URL";
const URL_REGION_BD = "YOUR_URL";

/* =========================
   STATE
========================= */

let chData=[];
let bdData=[];
let skuData=[];
let rgData=[];
let rgBdData=[];

let charts={};

let curWeek='';

/* =========================
   COLORS
========================= */

const TREND_COLORS=[

  '#7C79E0',
  '#E879A0',
  '#22C55E',
  '#F59E0B',
  '#3B82F6',
  '#EF4444',
  '#8B5CF6',
  '#06B6D4',
  '#10B981',
  '#F97316'

];

/* =========================
   HELPERS
========================= */

const num = v =>

  parseFloat(
    String(v||0).replace(',','.')
  ) || 0;

const fmt = v =>

  num(v).toLocaleString('id-ID');

function cfCls(v){

  if(v>=95) return 'good';

  if(v>=85) return 'warn';

  return 'bad';

}

function getChannel(row){

  return (
    row.Channel ||
    row['Channel Breakdown'] ||
    row.channel ||
    ''
  ).trim().toUpperCase();

}

function dc(k){

  if(charts[k]){

    charts[k].destroy();

    delete charts[k];

  }

}

/* =========================
   BUILD REGION CHART
========================= */

function buildRegionCh(ch, week){

  const color =
    ch==='MT'
    ? '#7C79E0'
    : '#3B82F6';

  const isCh = row =>
    getChannel(row).includes(ch);

  const rowsAll =
    rgBdData.filter(isCh);

  const rowsWeek =
    rowsAll.filter(
      d=>d.Week===week
    );

  /* =========================
     AGGREGATE REGION
  ========================= */

  const aggWeek={};

  rowsWeek.forEach(d=>{

    const rg =
      (d.Region||'').trim();

    if(!rg) return;

    if(!aggWeek[rg]){

      aggWeek[rg]={

        order:0,
        delivery:0,
        gap:0

      };

    }

    aggWeek[rg].order +=
      num(d['Order Quantity']);

    aggWeek[rg].delivery +=
      num(d['Delivery Quantity']);

    aggWeek[rg].gap +=
      num(d['GAP']);

  });

  const regions =
    Object.keys(aggWeek).sort();

  /* =========================
     HORIZONTAL BAR CHART
  ========================= */

  const hLabels = regions;

  const hData = regions.map(rg=>{

    const d=aggWeek[rg];

    return d.order>0

      ? parseFloat(

          (
            d.delivery /
            d.order *
            100

          ).toFixed(2)

        )

      : 0;

  });

  dc('rHBar'+ch);

  charts['rHBar'+ch] =

    new Chart(

      document.getElementById(
        'regionHBar'+ch
      ),

      {

        type:'bar',

        data:{

          labels:hLabels,

          datasets:[{

            data:hData,

            backgroundColor:color,

            borderRadius:8,

            borderSkipped:false,

            barThickness:28

          }]

        },

        options:{

          indexAxis:'y',

          responsive:true,

          maintainAspectRatio:false,

          layout:{

            padding:{

              right:70

            }

          },

          plugins:{

            legend:{
              display:false
            },

            tooltip:{

              callbacks:{

                label:(ctx)=>

                  ctx.raw.toFixed(2)+'%'

              }

            }

          },

          scales:{

            x:{

              min:0,

              max:110,

              ticks:{

                callback:v=>v+'%',

                font:{
                  size:10
                }

              },

              grid:{
                color:'#F3F4F6'
              }

            },

            y:{

              grid:{
                display:false
              },

              ticks:{

                font:{
                  size:11
                }

              }

            }

          },

          animation:{

            onComplete:function(){

              const chart =
                this.chart;

              const ctx =
                chart.ctx;

              ctx.font =
                'bold 11px Inter';

              ctx.fillStyle =
                '#374151';

              ctx.textAlign =
                'left';

              ctx.textBaseline =
                'middle';

              this.data.datasets.forEach(

                function(dataset,i){

                  const meta =
                    chart.getDatasetMeta(i);

                  meta.data.forEach(

                    function(bar,index){

                      const value =
                        dataset.data[index];

                      ctx.fillText(

                        value.toFixed(1)+'%',

                        bar.x + 10,

                        bar.y

                      );

                    }

                  );

                }

              );

            }

          }

        }

      }

    );

}

/* =========================
   INIT
========================= */

console.log(
  'SCM Dashboard Offline Ready'
);

</script>

</body>
</html>
