<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCM Dashboard Offline KPI</title>
  <style>
    :root {
      --ink: #14213d;
      --muted: #64748b;
      --line: #d7dee8;
      --panel: #ffffff;
      --bg: #f4f7fb;
      --navy: #0b2742;
      --blue: #2563eb;
      --green: #047857;
      --red: #b91c1c;
      --amber: #b45309;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    header {
      background: var(--navy);
      color: white;
      padding: 24px 28px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: 0;
    }

    header .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      color: #cbd5e1;
      font-size: 13px;
    }

    main {
      max-width: 1360px;
      margin: 0 auto;
      padding: 22px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      padding: 9px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
    }

    button.active {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      min-height: 110px;
    }

    .card .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .card .value {
      margin-top: 10px;
      font-size: 26px;
      font-weight: 800;
    }

    .card .logic {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .section {
      display: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .section.active { display: block; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .section-title h2 {
      margin: 0;
      font-size: 17px;
    }

    .table-wrap {
      overflow: auto;
      max-height: 68vh;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: white;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e8edf3;
      text-align: left;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      background: #eaf3ff;
      color: #10233f;
      z-index: 1;
    }

    tr:hover td { background: #f8fbff; }

    .bad { color: var(--red); font-weight: 800; }
    .ok { color: var(--green); font-weight: 800; }
    .warn { color: var(--amber); font-weight: 800; }

    .notice {
      padding: 14px 16px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
    }

    @media (max-width: 900px) {
      header { padding: 20px 16px; }
      main { padding: 14px; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
      .card .value { font-size: 22px; }
    }

    @media (max-width: 520px) {
      .kpi-grid { grid-template-columns: 1fr; }
      button { width: 100%; }
      .tabs { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>SCM Dashboard Offline KPI</h1>
    <div class="meta">
      <span id="period">Period: loading...</span>
      <span id="refresh">Last refresh: loading...</span>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="tabs" id="tabs"></div>
      <div class="status" id="status">Loading Google Sheet...</div>
    </div>

    <div class="kpi-grid" id="kpiGrid"></div>
    <div id="sections"></div>
  </main>

  <script>
    const SPREADSHEET_ID = "1MVI03doGhrEdJ9rYWcbr-29G3V0n2nYndGZw10z1QK0";
    const SHEETS = [
      { id: "channel_breakdown", label: "Channel Breakdown" },
      { id: "region_overall", label: "Region Overall" },
      { id: "region_channel", label: "Region Channel" },
      { id: "category_channel", label: "Category Channel" },
      { id: "loss_product", label: "Loss Product" }
    ];

    const state = { active: SHEETS[0].id, data: {} };

    function csvUrl(sheetName) {
      return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"' && quoted && next === '"') {
          value += '"';
          i++;
        } else if (c === '"') {
          quoted = !quoted;
        } else if (c === "," && !quoted) {
          row.push(value);
          value = "";
        } else if ((c === "\n" || c === "\r") && !quoted) {
          if (c === "\r" && next === "\n") i++;
          row.push(value);
          if (row.some(cell => cell !== "")) rows.push(row);
          row = [];
          value = "";
        } else {
          value += c;
        }
      }

      row.push(value);
      if (row.some(cell => cell !== "")) rows.push(row);
      return rows;
    }

    async function fetchSheet(sheetName) {
      const response = await fetch(csvUrl(sheetName));
      if (!response.ok) throw new Error(`Gagal load ${sheetName}`);
      return parseCsv(await response.text());
    }

    function percentNumber(value) {
      const parsed = Number(String(value).replace("%", "").replace(",", "."));
      return Number.isFinite(parsed) ? parsed : null;
    }

    function classForCaseFill(value) {
      const n = percentNumber(value);
      if (n === null) return "";
      if (n < 95) return "bad";
      if (n < 98) return "warn";
      return "ok";
    }

    function renderKpi(rows) {
      document.getElementById("period").textContent = `${rows[1]?.[3] || "Period"}: ${rows[1]?.[4] || "-"}`;
      document.getElementById("refresh").textContent = `${rows[1]?.[0] || "Last refresh"}: ${rows[1]?.[1] || "-"}`;

      const pairs = [
        rows[4]?.slice(0, 3),
        rows[4]?.slice(4, 7),
        rows[5]?.slice(0, 3),
        rows[5]?.slice(4, 7),
        rows[6]?.slice(0, 3),
        rows[6]?.slice(4, 7),
        rows[7]?.slice(0, 3),
        rows[7]?.slice(4, 7)
      ].filter(item => item && item[0]);

      document.getElementById("kpiGrid").innerHTML = pairs.map(item => {
        const cls = item[0].toLowerCase().includes("case fill") ? classForCaseFill(item[1]) : "";
        return `
          <div class="card">
            <div class="label">${escapeHtml(item[0])}</div>
            <div class="value ${cls}">${escapeHtml(item[1])}</div>
            <div class="logic">${escapeHtml(item[2] || "")}</div>
          </div>
        `;
      }).join("");
    }

    function renderTabs() {
      document.getElementById("tabs").innerHTML = SHEETS.map(sheet => `
        <button class="${sheet.id === state.active ? "active" : ""}" data-tab="${sheet.id}">
          ${sheet.label}
        </button>
      `).join("");

      document.querySelectorAll("[data-tab]").forEach(button => {
        button.addEventListener("click", () => {
          state.active = button.dataset.tab;
          renderTabs();
          renderSections();
        });
      });
    }

    function renderTable(rows) {
      const title = rows[0]?.[0] || "";
      const refresh = rows[1]?.[1] || "";
      const headers = rows[3] || [];
      const body = rows.slice(4);

      return `
        <div class="section-title">
          <h2>${escapeHtml(title)}</h2>
          <span class="status">${refresh ? `Refresh: ${escapeHtml(refresh)}` : ""}</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join("")}</tr>
            </thead>
            <tbody>
              ${body.map(row => `
                <tr>
                  ${headers.map((_, index) => {
                    const value = row[index] || "";
                    const cls = headers[index] === "Case Fill" ? classForCaseFill(value) : "";
                    return `<td class="${cls}">${escapeHtml(value)}</td>`;
                  }).join("")}
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderSections() {
      document.getElementById("sections").innerHTML = SHEETS.map(sheet => `
        <section class="section ${sheet.id === state.active ? "active" : ""}">
          ${state.data[sheet.id] ? renderTable(state.data[sheet.id]) : `<div class="notice">Loading ${sheet.label}...</div>`}
        </section>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function boot() {
      try {
        renderTabs();
        renderSections();

        const kpiRows = await fetchSheet("kpi_card");
        renderKpi(kpiRows);

        const results = await Promise.all(SHEETS.map(async sheet => {
          const rows = await fetchSheet(sheet.id);
          return [sheet.id, rows];
        }));

        for (const [id, rows] of results) state.data[id] = rows;
        renderSections();
        document.getElementById("status").textContent = "Google Sheet loaded";
      } catch (error) {
        document.getElementById("status").textContent = error.message;
        document.getElementById("sections").innerHTML = `
          <div class="notice">
            Data gagal dimuat. Pastikan Google Sheet sudah public read-only dan tab summary sudah ada.
          </div>
        `;
      }
    }

    boot();
  </script>
</body>
</html>
