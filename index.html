<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SCM Executive Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --bg:#F5F7FB;
    --card:#FFFFFF;

    --text:#111827;
    --muted:#6B7280;

    --border:#ECEEF4;

    --purple:#7C3AED;
    --purple2:#9333EA;

    --green:#10B981;
    --red:#EF4444;

    --shadow:
    0 10px 35px rgba(15,23,42,.06);

}

body{

    background:var(--bg);

    font-family:'Inter',sans-serif;

    color:var(--text);

}

/* HEADER */

.header{

    height:84px;

    background:
    linear-gradient(
        135deg,
        var(--purple),
        var(--purple2)
    );

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 34px;

    color:white;

}

.brand h1{

    font-family:'Syne',sans-serif;

    font-size:34px;

    font-weight:800;

}

.brand p{

    margin-top:5px;

    font-size:13px;

    opacity:.9;

}

.week-filter{

    border:none;

    background:rgba(255,255,255,.16);

    color:white;

    padding:13px 18px;

    border-radius:16px;

    font-weight:600;

    outline:none;

}

.week-filter option{

    color:black;

}

/* APP */

.app{

    display:grid;

    grid-template-columns:250px 1fr;

    min-height:calc(100vh - 84px);

}

/* SIDEBAR */

.sidebar{

    background:white;

    border-right:1px solid var(--border);

    padding:28px 18px;

}

.menu{

    display:flex;

    flex-direction:column;

    gap:12px;

}

.menu button{

    border:none;

    background:transparent;

    padding:16px 18px;

    border-radius:18px;

    cursor:pointer;

    text-align:left;

    font-size:14px;

    font-weight:600;

    color:var(--muted);

    transition:.2s;

}

.menu button:hover{

    background:#F4F5FA;

}

.menu button.active{

    background:
    linear-gradient(
        135deg,
        var(--purple),
        var(--purple2)
    );

    color:white;

}

/* CONTENT */

.content{

    padding:30px;

}

/* PAGE */

.page{

    display:none;

}

.page.active{

    display:block;

}

/* KPI */

.kpi-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:24px;

    margin-bottom:26px;

}

.kpi-card{

    background:white;

    border:1px solid var(--border);

    border-radius:30px;

    padding:30px;

    box-shadow:var(--shadow);

}

.kpi-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}

.kpi-title{

    font-size:20px;

    font-weight:700;

}

.badge{

    padding:8px 14px;

    border-radius:999px;

    font-size:12px;

    color:white;

    font-weight:700;

}

.mt{
    background:var(--purple);
}

.gt{
    background:var(--red);
}

.kpi-big{

    font-size:72px;

    line-height:1;

    font-family:'Syne',sans-serif;

    font-weight:800;

    margin-bottom:26px;

}

.kpi-detail{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:16px;

}

.detail{

    background:#F9FAFB;

    border-radius:18px;

    padding:16px;

}

.detail small{

    color:var(--muted);

    font-size:11px;

}

.detail strong{

    display:block;

    margin-top:8px;

    font-size:22px;

}

/* GRID */

.grid{

    display:grid;

    grid-template-columns:2fr 1fr;

    gap:24px;

    margin-bottom:24px;

}

/* CARD */

.card{

    background:white;

    border-radius:30px;

    border:1px solid var(--border);

    padding:28px;

    box-shadow:var(--shadow);

}

.card-title{

    font-size:18px;

    font-weight:700;

    margin-bottom:24px;

}

/* DONUT */

.donut-wrap{

    position:relative;

    width:290px;
    height:290px;

    margin:auto;

}

.donut-center{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

}

.donut-center h1{

    font-size:58px;

    font-family:'Syne',sans-serif;

}

.donut-center span{

    margin-top:6px;

    color:var(--muted);

}

/* TABLE */

table{

    width:100%;

    border-collapse:collapse;

}

th{

    text-align:left;

    padding:14px;

    font-size:12px;

    color:var(--muted);

    border-bottom:1px solid var(--border);

}

td{

    padding:18px 14px;

    border-bottom:1px solid #F3F4F6;

    font-size:13px;

}

/* SKU */

.sku-grid-page{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:22px;

}

.sku-card{

    background:white;

    border-radius:28px;

    border:1px solid var(--border);

    padding:24px;

    box-shadow:var(--shadow);

}

.sku-name{

    font-size:15px;

    font-weight:700;

    line-height:1.5;

    margin-bottom:18px;

}

.sku-detail{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;

}

.sku-box{

    background:#F9FAFB;

    border-radius:16px;

    padding:14px;

}

.sku-box small{

    color:var(--muted);

    font-size:11px;

}

.sku-box strong{

    display:block;

    margin-top:8px;

    font-size:18px;

}

.loss{
    color:var(--red);
}

.success{
    color:var(--green);
}

.cf{
    color:var(--purple);
}

/* RESPONSIVE */

@media(max-width:1200px){

    .grid{

        grid-template-columns:1fr;

    }

    .sku-grid-page{

        grid-template-columns:1fr;

    }

}

@media(max-width:900px){

    .app{

        grid-template-columns:1fr;

    }

    .kpi-grid{

        grid-template-columns:1fr;

    }

}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="brand">

        <h1>
            SCM Dashboard
        </h1>

        <p>
            Executive Case Fill Monitoring
        </p>

    </div>

    <select id="weekFilter"
            class="week-filter">
    </select>

</div>

<!-- APP -->

<div class="app">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="menu">

            <button class="active"
                    onclick="showPage('overview',this)">
                Overview
            </button>

            <button onclick="showPage('loss',this)">
                Trend SKU Loss
            </button>

            <button onclick="showPage('best',this)">
                Trend SKU Laku
            </button>

        </div>

    </div>

    <!-- CONTENT -->

    <div class="content">

        <!-- OVERVIEW -->

        <div class="page active"
             id="overviewPage">

            <!-- KPI -->

            <div class="kpi-grid">

                <!-- MT -->

                <div class="kpi-card">

                    <div class="kpi-top">

                        <div class="kpi-title">
                            Modern Trade
                        </div>

                        <div class="badge mt">
                            MT
                        </div>

                    </div>

                    <div class="kpi-big"
                         id="mtCF">
                        0%
                    </div>

                    <div class="kpi-detail">

                        <div class="detail">
                            <small>ORDER</small>
                            <strong id="mtOrder">0</strong>
                        </div>

                        <div class="detail">
                            <small>DELIVERY</small>
                            <strong id="mtDelivery">0</strong>
                        </div>

                        <div class="detail">
                            <small>GAP</small>
                            <strong id="mtGap">0</strong>
                        </div>

                        <div class="detail">
                            <small>CASE FILL</small>
                            <strong id="mtCF2">0%</strong>
                        </div>

                    </div>

                </div>

                <!-- GT -->

                <div class="kpi-card">

                    <div class="kpi-top">

                        <div class="kpi-title">
                            General Trade
                        </div>

                        <div class="badge gt">
                            GT
                        </div>

                    </div>

                    <div class="kpi-big"
                         id="gtCF">
                        0%
                    </div>

                    <div class="kpi-detail">

                        <div class="detail">
                            <small>ORDER</small>
                            <strong id="gtOrder">0</strong>
                        </div>

                        <div class="detail">
                            <small>DELIVERY</small>
                            <strong id="gtDelivery">0</strong>
                        </div>

                        <div class="detail">
                            <small>GAP</small>
                            <strong id="gtGap">0</strong>
                        </div>

                        <div class="detail">
                            <small>CASE FILL</small>
                            <strong id="gtCF2">0%</strong>
                        </div>

                    </div>

                </div>

            </div>

            <!-- CHART -->

            <div class="grid">

                <!-- BAR -->

                <div class="card">

                    <div class="card-title">
                        Case Fill % per Channel Breakdown
                    </div>

                    <canvas id="barChart"
                            height="120">
                    </canvas>

                </div>

                <!-- DONUT -->

                <div class="card">

                    <div class="card-title">
                        Overall Delivered vs GAP
                    </div>

                    <div class="donut-wrap">

                        <canvas id="donutChart"></canvas>

                        <div class="donut-center">

                            <h1 id="overallCF">
                                0%
                            </h1>

                            <span>
                                Delivered
                            </span>

                        </div>

                    </div>

                </div>

            </div>

            <!-- TABLE -->

            <div class="card">

                <div class="card-title">
                    KPI Breakdown
                </div>

                <table>

                    <thead>

                        <tr>

                            <th>Breakdown</th>
                            <th>Order</th>
                            <th>Delivery</th>
                            <th>Gap</th>
                            <th>Case Fill</th>

                        </tr>

                    </thead>

                    <tbody id="tableBody">

                    </tbody>

                </table>

            </div>

        </div>

        <!-- LOSS PAGE -->

        <div class="page"
             id="lossPage">

            <div class="sku-grid-page"
                 id="lossContainer">
            </div>

        </div>

        <!-- BEST PAGE -->

        <div class="page"
             id="bestPage">

            <div class="sku-grid-page"
                 id="bestContainer">
            </div>

        </div>

    </div>

</div>

<script>

/* =========================
CSV API
========================= */

const KPI_CHANNEL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSzawLo-UIWO6rctA1PJGsrpEQyoFzkONyyhYOPknMXJHVlV24tVXX0LhNM6N8q1nmN-InEme4C3iGE/pub?gid=349702860&single=true&output=csv";

const KPI_BREAKDOWN =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSzawLo-UIWO6rctA1PJGsrpEQyoFzkONyyhYOPknMXJHVlV24tVXX0LhNM6N8q1nmN-InEme4C3iGE/pub?gid=1343041753&single=true&output=csv";

const TOP_LOSS_PRODUCT =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSzawLo-UIWO6rctA1PJGsrpEQyoFzkONyyhYOPknMXJHVlV24tVXX0LhNM6N8q1nmN-InEme4C3iGE/pub?gid=1801155860&single=true&output=csv";

/* =========================
GLOBAL
========================= */

let channelData = [];
let breakdownData = [];
let lossData = [];

let barChart;
let donutChart;

/* =========================
HELPER
========================= */

function parseCSV(text){

    const rows =
    text.trim().split("\n");

    const headers =
    rows[0].split(",");

    return rows.slice(1).map(row=>{

        const cols =
        row.split(",");

        const obj = {};

        headers.forEach((h,i)=>{

            obj[h.trim()] =
            cols[i]
            ? cols[i]
                .replace(/"/g,'')
                .trim()
            : "";

        });

        return obj;

    });

}

function fmt(n){

    return Number(n)
    .toLocaleString("id-ID");

}

/* NAVIGATION */

function showPage(page,btn){

    document
    .querySelectorAll(".page")
    .forEach(p=>
        p.classList.remove("active")
    );

    document
    .querySelectorAll(".menu button")
    .forEach(b=>
        b.classList.remove("active")
    );

    btn.classList.add("active");

    document.getElementById(
        page+"Page"
    ).classList.add("active");

}

/* LOAD */

async function loadData(){

    const [
        c1,
        c2,
        c3
    ] = await Promise.all([

        fetch(KPI_CHANNEL)
        .then(r=>r.text()),

        fetch(KPI_BREAKDOWN)
        .then(r=>r.text()),

        fetch(TOP_LOSS_PRODUCT)
        .then(r=>r.text())

    ]);

    channelData =
    parseCSV(c1);

    breakdownData =
    parseCSV(c2);

    lossData =
    parseCSV(c3);

    setupWeek();

}

/* WEEK */

function setupWeek(){

    const weeks =
    [...new Set(
        breakdownData.map(d=>d.Week)
    )];

    const select =
    document.getElementById(
        "weekFilter"
    );

    select.innerHTML =
    weeks.map(w=>

        `<option>${w}</option>`

    ).join('');

    render(weeks[0]);

    select.addEventListener(
        "change",
        ()=>render(select.value)
    );

}

/* RENDER */

function render(week){

    const channels =
    channelData.filter(
        d=>d.Week===week
    );

    const breakdown =
    breakdownData.filter(
        d=>d.Week===week
    );

    const losses =
    lossData.filter(
        d=>d.Week===week
    );

    const mt =
    channels.find(d=>
        d.Channel.includes("MT")
    );

    const gt =
    channels.find(d=>
        d.Channel.includes("GT")
    );

    /* MT */

    if(mt){

        document.getElementById("mtOrder").innerHTML =
        fmt(mt["Order Quantity"]);

        document.getElementById("mtDelivery").innerHTML =
        fmt(mt["Delivery Quantity"]);

        document.getElementById("mtGap").innerHTML =
        fmt(mt["GAP"]);

        document.getElementById("mtCF").innerHTML =
        Number(mt["Case Fill"]).toFixed(2)+"%";

        document.getElementById("mtCF2").innerHTML =
        Number(mt["Case Fill"]).toFixed(2)+"%";

    }

    /* GT */

    if(gt){

        document.getElementById("gtOrder").innerHTML =
        fmt(gt["Order Quantity"]);

        document.getElementById("gtDelivery").innerHTML =
        fmt(gt["Delivery Quantity"]);

        document.getElementById("gtGap").innerHTML =
        fmt(gt["GAP"]);

        document.getElementById("gtCF").innerHTML =
        Number(gt["Case Fill"]).toFixed(2)+"%";

        document.getElementById("gtCF2").innerHTML =
        Number(gt["Case Fill"]).toFixed(2)+"%";

    }

    /* OVERALL */

    const totalOrder =
    channels.reduce(
        (a,b)=>
        a+Number(
            b["Order Quantity"]
        ),0
    );

    const totalDelivery =
    channels.reduce(
        (a,b)=>
        a+Number(
            b["Delivery Quantity"]
        ),0
    );

    const overall =
    (totalDelivery/totalOrder)*100;

    document.getElementById(
        "overallCF"
    ).innerHTML =
    overall.toFixed(1)+"%";

    /* TABLE */

    document.getElementById(
        "tableBody"
    ).innerHTML =
    breakdown.map(d=>`

        <tr>

            <td>
                ${d["Channel Breakdown"]}
            </td>

            <td>
                ${fmt(d["Order Quantity"])}
            </td>

            <td>
                ${fmt(d["Delivery Quantity"])}
            </td>

            <td>
                ${fmt(d["GAP"])}
            </td>

            <td>
                ${Number(d["Case Fill"]).toFixed(2)}%
            </td>

        </tr>

    `).join('');

    /* LOSS */

    document.getElementById(
        "lossContainer"
    ).innerHTML =
    losses
    .sort((a,b)=>
        Number(b.GAP)-Number(a.GAP)
    )
    .slice(0,12)
    .map(d=>`

        <div class="sku-card">

            <div class="sku-name">

                ${d["Product Name"]}

            </div>

            <div class="sku-detail">

                <div class="sku-box">
                    <small>ORDER</small>
                    <strong>
                        ${fmt(d["Order Quantity"])}
                    </strong>
                </div>

                <div class="sku-box">
                    <small>DELIVERY</small>
                    <strong>
                        ${fmt(d["Delivery Quantity"])}
                    </strong>
                </div>

                <div class="sku-box">
                    <small>GAP</small>
                    <strong class="loss">
                        ${fmt(d["GAP"])}
                    </strong>
                </div>

                <div class="sku-box">
                    <small>CASE FILL</small>
                    <strong class="cf">
                        ${Number(d["Case Fill"]).toFixed(1)}%
                    </strong>
                </div>

            </div>

        </div>

    `).join('');

    /* BEST */

    document.getElementById(
        "bestContainer"
    ).innerHTML =
    losses
    .sort((a,b)=>

        Number(
            b["Delivery Quantity"]
        )
        -
        Number(
            a["Delivery Quantity"]
        )

    )
    .slice(0,12)
    .map(d=>`

        <div class="sku-card">

            <div class="sku-name">

                ${d["Product Name"]}

            </div>

            <div class="sku-detail">

                <div class="sku-box">
                    <small>ORDER</small>
                    <strong>
                        ${fmt(d["Order Quantity"])}
                    </strong>
                </div>

                <div class="sku-box">
                    <small>DELIVERY</small>
                    <strong class="success">
                        ${fmt(d["Delivery Quantity"])}
                    </strong>
                </div>

                <div class="sku-box">
                    <small>GAP</small>
                    <strong>
                        ${fmt(d["GAP"])}
                    </strong>
                </div>

                <div class="sku-box">
                    <small>CASE FILL</small>
                    <strong class="cf">
                        ${Number(d["Case Fill"]).toFixed(1)}%
                    </strong>
                </div>

            </div>

        </div>

    `).join('');

    buildCharts(
        breakdown,
        overall
    );

}

/* CHART */

function buildCharts(data,overall){

    if(barChart)
        barChart.destroy();

    if(donutChart)
        donutChart.destroy();

    const labels =
    data.map(
        d=>d["Channel Breakdown"]
    );

    const values =
    data.map(
        d=>Number(d["Case Fill"])
    );

    barChart =
    new Chart(

        document.getElementById(
            "barChart"
        ),

        {

            type:"bar",

            data:{

                labels,

                datasets:[{

                    data:values,

                    borderRadius:14,

                    backgroundColor:
                    labels.map(l=>

                        l.includes("MT")
                        ? "#7C3AED"
                        : "#EF4444"

                    )

                }]

            },

            options:{

                responsive:true,

                plugins:{
                    legend:{
                        display:false
                    }
                },

                scales:{

                    x:{
                        grid:{
                            display:false
                        }
                    },

                    y:{

                        min:0,
                        max:110,

                        grid:{
                            color:"#F3F4F6"
                        },

                        ticks:{
                            callback:v=>v+"%"
                        }

                    }

                }

            }

        }

    );

    donutChart =
    new Chart(

        document.getElementById(
            "donutChart"
        ),

        {

            type:"doughnut",

            data:{

                labels:[
                    "Delivered",
                    "Gap"
                ],

                datasets:[{

                    data:[
                        overall,
                        100-overall
                    ],

                    backgroundColor:[
                        "#7C3AED",
                        "#E5E7EB"
                    ],

                    borderWidth:0

                }]

            },

            options:{

                cutout:"76%",

                plugins:{
                    legend:{
                        display:false
                    }
                }

            }

        }

    );

}

loadData();

</script>

</body>

</html>
