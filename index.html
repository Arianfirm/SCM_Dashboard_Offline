<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SCM Case Fill Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --bg:#0F0B1A;
    --card:#171126;
    --card2:#1E1630;

    --purple:#7C3AED;
    --purple2:#A855F7;

    --red:#EF4444;
    --green:#10B981;

    --text:#F8FAFC;
    --muted:#A1A1AA;

    --border:rgba(255,255,255,.06);

    --fontTitle:'Syne',sans-serif;
    --fontBody:'DM Sans',sans-serif;

}

body{

    background:linear-gradient(
        180deg,
        #0B0814 0%,
        #120C20 100%
    );

    color:var(--text);

    font-family:var(--fontBody);

}

/* SIDEBAR */

.sidebar{

    position:fixed;

    left:0;
    top:0;

    width:260px;
    height:100vh;

    background:#120D1F;

    border-right:1px solid var(--border);

    padding:24px 18px;

    overflow:auto;

}

.brand{

    margin-bottom:32px;

}

.brand h1{

    font-family:var(--fontTitle);

    font-size:26px;

    font-weight:800;

}

.brand p{

    color:var(--muted);

    font-size:12px;

    margin-top:6px;

}

.menu{

    display:flex;

    flex-direction:column;

    gap:10px;

}

.menu button{

    background:transparent;

    border:none;

    color:var(--muted);

    padding:14px 16px;

    border-radius:14px;

    text-align:left;

    font-size:14px;

    cursor:pointer;

    transition:.2s;

}

.menu button:hover{

    background:rgba(255,255,255,.04);

    color:white;

}

.menu button.active{

    background:linear-gradient(
        135deg,
        var(--purple),
        var(--purple2)
    );

    color:white;

    font-weight:700;

}

/* MAIN */

.main{

    margin-left:260px;

    padding:24px;

}

/* HEADER */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:22px;

}

.page-title{

    font-family:var(--fontTitle);

    font-size:34px;

    font-weight:800;

}

.week-select{

    background:var(--card);

    border:1px solid var(--border);

    color:white;

    padding:10px 14px;

    border-radius:12px;

    outline:none;

}

/* KPI */

.kpi-grid{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:18px;

    margin-bottom:22px;

}

.kpi{

    background:linear-gradient(
        180deg,
        #1B1430,
        #171126
    );

    border:1px solid var(--border);

    border-radius:22px;

    padding:22px;

}

.kpi small{

    color:var(--muted);

    font-size:12px;

}

.kpi h2{

    margin-top:12px;

    font-size:38px;

    font-family:var(--fontTitle);

}

.kpi span{

    display:block;

    margin-top:8px;

    color:#C4B5FD;

    font-size:13px;

}

/* GRID */

.grid{

    display:grid;

    grid-template-columns:2fr 1fr;

    gap:18px;

    margin-bottom:18px;

}

/* CARD */

.card{

    background:linear-gradient(
        180deg,
        #1A1428,
        #161122
    );

    border:1px solid var(--border);

    border-radius:24px;

    padding:22px;

}

.card-title{

    font-size:16px;

    font-weight:700;

    margin-bottom:18px;

}

/* TABLE */

table{

    width:100%;

    border-collapse:collapse;

}

th{

    text-align:left;

    color:var(--muted);

    font-size:12px;

    padding:12px;

}

td{

    padding:14px 12px;

    border-top:1px solid rgba(255,255,255,.04);

    font-size:13px;

}

/* LIST */

.list{

    display:flex;

    flex-direction:column;

    gap:14px;

}

.list-item{

    background:rgba(255,255,255,.03);

    border-radius:16px;

    padding:14px;

}

.list-item h4{

    font-size:14px;

}

.list-item span{

    color:var(--red);

    font-weight:700;

    display:block;

    margin-top:8px;

}

.progress{

    width:100%;

    height:8px;

    background:rgba(255,255,255,.06);

    border-radius:999px;

    overflow:hidden;

    margin-top:10px;

}

.progress div{

    height:100%;

    background:linear-gradient(
        90deg,
        #EF4444,
        #F97316
    );

}

/* DONUT */

.donut-wrap{

    position:relative;

    width:260px;
    height:260px;

    margin:auto;

}

.donut-center{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

}

.donut-center h1{

    font-size:42px;

    font-family:var(--fontTitle);

}

.donut-center span{

    color:var(--muted);

    margin-top:6px;

}

/* RESPONSIVE */

@media(max-width:1200px){

    .kpi-grid{

        grid-template-columns:1fr 1fr;

    }

    .grid{

        grid-template-columns:1fr;

    }

}

@media(max-width:900px){

    .sidebar{

        width:100%;
        height:auto;
        position:relative;

    }

    .main{

        margin-left:0;

    }

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="brand">

        <h1>
            SCM Dashboard
        </h1>

        <p>
            Case Fill Monitoring
        </p>

    </div>

    <div class="menu">

        <button class="active">
            Overview
        </button>

        <button>
            Trend SKU Laku
        </button>

        <button>
            Trend SKU Loss
        </button>

        <button>
            Region Performance
        </button>

        <button>
            Channel Breakdown
        </button>

    </div>

</div>

<!-- MAIN -->

<div class="main">

    <!-- HEADER -->

    <div class="topbar">

        <div class="page-title">
            Overview Dashboard
        </div>

        <select class="week-select"
                id="weekFilter">
        </select>

    </div>

    <!-- KPI -->

    <div class="kpi-grid">

        <div class="kpi">

            <small>
                Overall Case Fill
            </small>

            <h2 id="overallCF">
                0%
            </h2>

            <span>
                Total Performance
            </span>

        </div>

        <div class="kpi">

            <small>
                Total Order
            </small>

            <h2 id="totalOrder">
                0
            </h2>

            <span>
                Order Quantity
            </span>

        </div>

        <div class="kpi">

            <small>
                Total Delivery
            </small>

            <h2 id="totalDelivery">
                0
            </h2>

            <span>
                Delivered Qty
            </span>

        </div>

        <div class="kpi">

            <small>
                Total GAP
            </small>

            <h2 id="totalGap">
                0
            </h2>

            <span>
                Loss Quantity
            </span>

        </div>

    </div>

    <!-- GRID -->

    <div class="grid">

        <!-- BAR -->

        <div class="card">

            <div class="card-title">
                Channel Case Fill
            </div>

            <canvas id="barChart"
                    height="120">
            </canvas>

        </div>

        <!-- DONUT -->

        <div class="card">

            <div class="card-title">
                Delivered vs GAP
            </div>

            <div class="donut-wrap">

                <canvas id="donutChart"></canvas>

                <div class="donut-center">

                    <h1 id="donutText">
                        0%
                    </h1>

                    <span>
                        Delivered
                    </span>

                </div>

            </div>

        </div>

    </div>

    <!-- GRID 2 -->

    <div class="grid">

        <!-- TABLE -->

        <div class="card">

            <div class="card-title">
                KPI Breakdown
            </div>

            <table>

                <thead>

                    <tr>

                        <th>Channel</th>
                        <th>Order</th>
                        <th>Delivery</th>
                        <th>Gap</th>
                        <th>CF%</th>

                    </tr>

                </thead>

                <tbody id="tableBody">

                </tbody>

            </table>

        </div>

        <!-- LOSS -->

        <div class="card">

            <div class="card-title">
                Trend SKU Loss
            </div>

            <div class="list"
                 id="lossList">
            </div>

        </div>

    </div>

</div>

<script>

/* =========================
API URL
========================= */

const KPI_CHANNEL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSzawLo-UIWO6rctA1PJGsrpEQyoFzkONyyhYOPknMXJHVlV24tVXX0LhNM6N8q1nmN-InEme4C3iGE/pub?gid=349702860&single=true&output=csv";

const KPI_BREAKDOWN =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSzawLo-UIWO6rctA1PJGsrpEQyoFzkONyyhYOPknMXJHVlV24tVXX0LhNM6N8q1nmN-InEme4C3iGE/pub?gid=1343041753&single=true&output=csv";

const LOSS_PRODUCT =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSzawLo-UIWO6rctA1PJGsrpEQyoFzkONyyhYOPknMXJHVlV24tVXX0LhNM6N8q1nmN-InEme4C3iGE/pub?gid=1801155860&single=true&output=csv";

/* =========================
HELPER
========================= */

function parseCSV(text){

    const rows =
    text.trim().split("\n");

    return rows.map(r=>
        r.split(",")
    );

}

function fmt(n){

    return Number(n)
    .toLocaleString("id-ID");

}

/* =========================
LOAD DATA
========================= */

async function loadDashboard(){

    /* KPI CHANNEL */

    const res1 =
    await fetch(KPI_CHANNEL);

    const txt1 =
    await res1.text();

    const data1 =
    parseCSV(txt1);

    /* KPI BREAKDOWN */

    const res2 =
    await fetch(KPI_BREAKDOWN);

    const txt2 =
    await res2.text();

    const data2 =
    parseCSV(txt2);

    /* LOSS */

    const res3 =
    await fetch(LOSS_PRODUCT);

    const txt3 =
    await res3.text();

    const data3 =
    parseCSV(txt3);

    buildKPI(data1);

    buildTable(data2);

    buildLoss(data3);

    buildCharts(data2);

}

/* =========================
KPI
========================= */

function buildKPI(data){

    let totalOrder = 0;
    let totalDelivery = 0;
    let totalGap = 0;

    data.slice(1).forEach(r=>{

        totalOrder +=
        Number(r[1]) || 0;

        totalDelivery +=
        Number(r[2]) || 0;

        totalGap +=
        Number(r[3]) || 0;

    });

    const cf =
    totalOrder
    ? (totalDelivery/totalOrder)*100
    : 0;

    document.getElementById(
        "overallCF"
    ).innerHTML =
    cf.toFixed(1)+"%";

    document.getElementById(
        "totalOrder"
    ).innerHTML =
    fmt(totalOrder);

    document.getElementById(
        "totalDelivery"
    ).innerHTML =
    fmt(totalDelivery);

    document.getElementById(
        "totalGap"
    ).innerHTML =
    fmt(totalGap);

    document.getElementById(
        "donutText"
    ).innerHTML =
    cf.toFixed(1)+"%";

}

/* =========================
TABLE
========================= */

function buildTable(data){

    let html = "";

    data.slice(1).forEach(r=>{

        html += `

        <tr>

            <td>${r[1]}</td>
            <td>${fmt(r[2])}</td>
            <td>${fmt(r[3])}</td>
            <td>${fmt(r[4])}</td>
            <td>${r[5]}%</td>

        </tr>

        `;

    });

    document.getElementById(
        "tableBody"
    ).innerHTML =
    html;

}

/* =========================
LOSS
========================= */

function buildLoss(data){

    let html = "";

    data.slice(1,6).forEach(r=>{

        const gap =
        Number(r[4]) || 0;

        html += `

        <div class="list-item">

            <h4>
                ${r[1]}
            </h4>

            <span>
                GAP : ${fmt(gap)}
            </span>

            <div class="progress">

                <div style="
                    width:${Math.min(gap/1000*100,100)}%
                "></div>

            </div>

        </div>

        `;

    });

    document.getElementById(
        "lossList"
    ).innerHTML =
    html;

}

/* =========================
CHART
========================= */

function buildCharts(data){

    const labels =
    data.slice(1).map(r=>r[1]);

    const values =
    data.slice(1).map(r=>
        Number(r[5]) || 0
    );

    /* BAR */

    new Chart(

        document.getElementById(
            "barChart"
        ),

        {

            type:"bar",

            data:{

                labels,

                datasets:[{

                    data:values,

                    backgroundColor:
                    "#7C3AED",

                    borderRadius:12

                }]

            },

            options:{

                plugins:{

                    legend:{
                        display:false
                    }

                },

                scales:{

                    y:{

                        min:0,

                        max:110

                    }

                }

            }

        }

    );

    /* DONUT */

    const avg =
    values.reduce((a,b)=>a+b,0)
    / values.length;

    new Chart(

        document.getElementById(
            "donutChart"
        ),

        {

            type:"doughnut",

            data:{

                labels:[
                    "Delivered",
                    "Gap"
                ],

                datasets:[{

                    data:[
                        avg,
                        100-avg
                    ],

                    backgroundColor:[
                        "#7C3AED",
                        "#2B1F47"
                    ],

                    borderWidth:0

                }]

            },

            options:{

                cutout:"75%",

                plugins:{

                    legend:{
                        display:false
                    }

                }

            }

        }

    );

}

loadDashboard();

</script>

</body>
</html>
