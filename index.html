<script>

const SPREADSHEET_ID =
"1xTEZKFhTzaxupONEBxX0iQniYhsaMZlfEiCGEja_qTQ";

const BREAKDOWN_GID =
"1343041753";

/* =========================
CSV URL
========================= */

const csvUrl =
`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${BREAKDOWN_GID}`;

let dashboardData = [];

let barChart;
let donutChart;

/* =========================
LOAD DATA
========================= */

async function loadData(){

    const res =
    await fetch(csvUrl);

    const csv =
    await res.text();

    const rows =
    csv.split("\n")
    .slice(1);

    dashboardData = [];

    rows.forEach(r=>{

        const c =
        r.split(",");

        if(c.length >= 6){

            dashboardData.push({

                week:
                c[0]
                .replace(/"/g,''),

                channel:
                c[1]
                .replace(/"/g,''),

                orderQty:
                parseFloat(c[2]) || 0,

                deliveryQty:
                parseFloat(c[3]) || 0,

                gap:
                parseFloat(c[4]) || 0,

                caseFill:
                parseFloat(c[5]) || 0

            });

        }

    });

    setupFilter();

}

/* =========================
FILTER
========================= */

function setupFilter(){

    const weeks =
    [...new Set(
        dashboardData.map(d=>d.week)
    )];

    const filter =
    document.getElementById(
        "weekFilter"
    );

    filter.innerHTML = "";

    weeks.forEach(w=>{

        filter.innerHTML +=
        `<option value="${w}">
            ${w}
        </option>`;

    });

    renderDashboard(
        weeks[0]
    );

    filter.addEventListener(
        "change",
        ()=>{

            renderDashboard(
                filter.value
            );

        }
    );

}

/* =========================
RENDER DASHBOARD
========================= */

function renderDashboard(week){

    const data =
    dashboardData.filter(
        d=>d.week === week
    );

    let totalOrder = 0;
    let totalDelivery = 0;
    let totalGap = 0;

    let mtOrder = 0;
    let mtDelivery = 0;

    let gtOrder = 0;
    let gtDelivery = 0;

    let labels = [];
    let values = [];

    let tableHTML = "";

    data.forEach(d=>{

        totalOrder += d.orderQty;
        totalDelivery += d.deliveryQty;
        totalGap += d.gap;

        labels.push(d.channel);
        values.push(d.caseFill);

        /* MT */

        if(d.channel === "MT"){

            mtOrder += d.orderQty;
            mtDelivery += d.deliveryQty;

        }

        /* GT */

        if(d.channel === "GT"){

            gtOrder += d.orderQty;
            gtDelivery += d.deliveryQty;

        }

        tableHTML += `

        <tr>

            <td>${d.channel}</td>

            <td>
                ${d.orderQty.toLocaleString()}
            </td>

            <td>
                ${d.deliveryQty.toLocaleString()}
            </td>

            <td class="good">
                ${d.caseFill.toFixed(2)}%
            </td>

        </tr>

        `;

    });

    /* CASE FILL */

    const totalCF =
    totalOrder
    ? (totalDelivery / totalOrder) * 100
    : 0;

    const mtCF =
    mtOrder
    ? (mtDelivery / mtOrder) * 100
    : 0;

    const gtCF =
    gtOrder
    ? (gtDelivery / gtOrder) * 100
    : 0;

    /* KPI */

    document.getElementById(
        "totalOrder"
    ).innerHTML =
    totalOrder.toLocaleString();

    document.getElementById(
        "totalDelivery"
    ).innerHTML =
    totalDelivery.toLocaleString();

    document.getElementById(
        "caseFill"
    ).innerHTML =
    totalCF.toFixed(2) +
    "% Total CF";

    document.getElementById(
        "mtQty"
    ).innerHTML =
    mtCF.toFixed(2) + "%";

    document.getElementById(
        "gtQty"
    ).innerHTML =
    gtCF.toFixed(2) + "%";

    /* TABLE */

    document.getElementById(
        "tableData"
    ).innerHTML =
    tableHTML;

    createCharts(
        labels,
        values,
        totalCF
    );

}

/* =========================
CHART
========================= */

function createCharts(
    labels,
    values,
    totalCF
){

    if(barChart){

        barChart.destroy();

    }

    if(donutChart){

        donutChart.destroy();

    }

    barChart = new Chart(

        document.getElementById(
            "barChart"
        ),

        {

            type:"bar",

            data:{

                labels:labels,

                datasets:[{

                    label:"Case Fill",

                    data:values

                }]

            }

        }

    );

    donutChart = new Chart(

        document.getElementById(
            "donutChart"
        ),

        {

            type:"doughnut",

            data:{

                labels:[
                    "Delivered",
                    "Gap"
                ],

                datasets:[{

                    data:[
                        totalCF,
                        100-totalCF
                    ]

                }]

            }

        }

    );

}

loadData();

</script>
